name: NebiusGuard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Run Test Suite
      run: npm test
    - name: Run Demo Simulation
      run: npm run demo
